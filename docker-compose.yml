version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./storage/contract_ai.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-contractai_super_secret_jwt_key_2026}
      - PROJECT_NAME=${PROJECT_NAME:-CONTRACTAI}
      - API_V1_STR=${API_V1_STR:-/api}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - STORAGE_DIR=./storage
      - UPLOAD_DIR=./storage/uploads
      - REPORT_DIR=./storage/reports
      - VECTOR_DB_DIR=./storage/vector_db
      - USE_OLLAMA=${USE_OLLAMA:-false}
    volumes:
      - ./storage:/app/storage
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
